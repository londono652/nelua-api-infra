name: infra

# Pull request -> valida y publica el plan como comentario (no crea nada).
# Push a main  -> valida, planea y, tras aprobación manual, aplica.
on:
  pull_request:
    paths:
      - "stacks/**"
      - "k8s/**"
      - "scripts/**"
      - ".checkov.yaml"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "stacks/**"
      - "k8s/**"
      - "scripts/**"
      - ".checkov.yaml"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos ejecuciones de Terraform a la vez sobre la misma infraestructura.
concurrency:
  group: infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  PROJECT: nelua-api
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.4"

jobs:
  validate:
    name: Formato, validación y seguridad
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Formato (terraform fmt)
        run: terraform fmt -check -recursive stacks

      - name: Validación (terraform validate)
        run: |
          for stack in bootstrap persistent platform; do
            echo "::group::$stack"
            terraform -chdir="stacks/$stack" init -backend=false -input=false
            terraform -chdir="stacks/$stack" validate
            echo "::endgroup::"
          done

      - name: Seguridad de la IaC (checkov)
        run: |
          pip install --quiet checkov
          checkov --directory stacks --framework terraform --config-file .checkov.yaml --compact --quiet

  plan:
    name: Plan (${{ matrix.stack }})
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # autenticación en AWS por OIDC
      contents: read
      pull-requests: write # publicar el plan como comentario
    strategy:
      fail-fast: false
      matrix:
        stack: [persistent, platform]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform plan
        run: |
          terraform -chdir="stacks/${{ matrix.stack }}" init -input=false
          terraform -chdir="stacks/${{ matrix.stack }}" plan -input=false -no-color | tee plan.txt

      - name: Resumen del plan
        run: |
          summary=$(grep -E '^(Plan:|No changes)' plan.txt | tail -1 || true)
          {
            echo "### Plan del stack \`${{ matrix.stack }}\`"
            echo
            echo "**${summary:-Sin resumen}**"
            echo
            echo "<details><summary>Ver el plan completo</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el plan en el pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  apply:
    name: Apply
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # El environment "infra" exige aprobación manual antes de aplicar.
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Apply del stack persistent (ECR, certificado, contrato)
        run: |
          terraform -chdir=stacks/persistent init -input=false
          terraform -chdir=stacks/persistent apply -input=false -auto-approve

      # Interruptor de costo: la plataforma solo se crea cuando PLATFORM_ENABLED es "true".
      - name: Apply del stack platform (VPC, EKS, ALB, WAF, DNS)
        if: vars.PLATFORM_ENABLED == 'true'
        run: |
          terraform -chdir=stacks/platform init -input=false
          terraform -chdir=stacks/platform apply -input=false -auto-approve

      - name: Manifiestos de plataforma en el clúster
        if: vars.PLATFORM_ENABLED == 'true'
        run: bash scripts/apply-k8s.sh

      - name: Plataforma apagada
        if: vars.PLATFORM_ENABLED != 'true'
        run: echo "PLATFORM_ENABLED no es 'true'; el stack platform no se aplicó." >> "$GITHUB_STEP_SUMMARY"
